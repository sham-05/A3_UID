<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket HQ</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <nav class="navbar">
        <div class="navbar-logo">
            <button class="nav-btn" aria-label="Menu">
            <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        <div class="navbar-title">Cricket HQ</div>
        <div class="navbar-actions">
            <button class="nav-btn" aria-label="Search">
                <i style="height:20x"class="fa-solid fa-magnifying-glass"></i>
            </button>
            <button class="nav-btn" aria-label="Cart">
                <i class="fa-solid fa-cart-shopping"></i>
            </button>
        </div>
    </nav>
    <div class="hero-section">
        <img class="hero-img" src="/assets/pngimg.com - cricket_PNG133.png">
        <div class="hero-content">
            <div class="hero-text">
                <span class="hero-word">OWN</span>
                <span class="hero-word">THE</span>
                <span class="hero-word hero-word--green">CREASE</span>
            </div>
            <div class="hero-buttons">
                <button class="btn btn-primary">SHOP NOW</button>
                <button class="btn btn-secondary">NEW ARRIVALS</button>
            </div>
        </div>
    </div>
</body>
</html>
