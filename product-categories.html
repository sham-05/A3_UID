<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="product-categories.css">
    <link rel="stylesheet" href="animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <nav class="navbar">
        <div class="navbar-logo">
            <button class="nav-btn" aria-label="Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        <div class="navbar-title" onclick="window.location.href='/index'">Cricket HQ</div>
        <div class="navbar-actions">
            <button class="nav-btn" aria-label="Search">
                <i style="height:20x" class="fa-solid fa-magnifying-glass"></i>
            </button>
            <button class="nav-btn" aria-label="Cart" onclick="openCart()">
                <i class="fa-solid fa-cart-shopping"></i>
            </button>
        </div>
    </nav>
    <div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
    <div class="cart-panel" id="cartPanel">
        <div class="cart-header">
            <h2 class="cart-title">My Cart</h2>
            <button class="cart-close-btn" onclick="closeCart()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer" id="cartFooter" style="display:none;">
            <div class="cart-total-row">
                <span class="cart-total-label">Total</span>
                <span class="cart-total-value" id="cartTotal"></span>
            </div>
            <button class="btn btn-primary cart-checkout-btn"
                onclick="window.location.href='/checkout.html'">Checkout</button>
        </div>
    </div>
    <section class="product-header">
        <h3 class="shop-by-text">SHOP BY CATEGORY</h3>
        <h2 class="product-title">PRODUCT CATEGORIES</h2>
        <div class="breadcrumb-nav">
            <a class="breadcrumb-link" href="index.html">HOME</a>
            <a class="breadcrumb-link">></a>
            <a href="product-categories.html" class="breadcrumb-link">PRODUCT CATEGORIES</a>
        </div>
    </section>
    <section class="products">
        <div class="product-categories-grid">
            <a class="product-categories-card" href="/product_categories/bats.html">
                <img src="/assets/bat.png">
                <h3>BATS</h3>
            </a>
            <a class="product-categories-card" href="products.html?type=gloves">
                <img src="/assets/gloves.png">
                <h3>GLOVES</h3>
            </a>
            <a class="product-categories-card" href="/product_categories/shoes.html">
                <img src="/assets/shoes.png">
                <h3>SHOES</h3>
            </a>
            <a class="product-categories-card" href="products.html?type=helmets">
                <img src="/assets/bat.png">
                <h3>HELMETS</h3>
            </a>
            <a class="product-categories-card" href="products.html?type=pads">
                <img src="/assets/pads.png">
                <h3>PADS</h3>
            </a>
            <a class="product-categories-card" href="products.html?type=bags">
                <img src="/assets/bag.png">
                <h3>BAGS</h3>
            </a>
        </div>
    </section>
    <footer class="footer">
        <div class="footer-main">
            <div class="footer-brand">
                <h3 class="footer-title">CRICKET HQ</h3>
                <div class="footer-social">
                    <a href="#" class="social-icon" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#" class="social-icon" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
                    <a href="#" class="social-icon" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                </div>
            </div>
            <div class="footer-link-container">
                <a class="footer-link" href="index.html">HOME</a>
                <a class="footer-link" href="product-categories.html">PRODUCT</a>
                <a class="footer-link" href="cart.html">CART</a>
                <a class="footer-link" href="about-us.html">ABOUT US</a>
                <a class="footer-link">TESTIMONIALS</a>
                <a class="footer-link">COACHING</a>
                <a class="footer-link">NET HIRE</a>
                <a class="footer-link">HIRING</a>
            </div>
        </div>
        <div class="footer-bottom">
            <span class="footer-copyright">&copy; 2024 Cricket HQ. All rights reserved.</span>
            <a href="#" class="footer-privacy">Privacy Policy</a>
        </div>
    </footer>
    <script src="cart.js"></script>
</body>

</html>
